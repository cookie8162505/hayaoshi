<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7a1a1a">
<title>早押しボタン｜労協NETクイズ アタック25</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#2a1a40;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
    background:radial-gradient(120% 70% at 50% 0%,#fff3c4 0%,#ffcf6b 35%,#f07a2a 70%,#b8261c 100%);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 115%,rgba(255,255,255,.18) 0 8deg,transparent 8deg 16deg);}
  .scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);}
  .hidden{display:none !important;}

  /* ===== OP ===== */
  #op .logo{width:min(94vw,520px);filter:drop-shadow(0 8px 18px rgba(120,30,0,.35));animation:logoIn .7s cubic-bezier(.22,1,.36,1) .25s both;}
  @keyframes logoIn{0%{transform:translateX(120vw) skewX(-18deg);}55%{transform:translateX(-5%) skewX(8deg);}75%{transform:translateX(2%) skewX(-3deg);}100%{transform:none;}}
  #op.shake{animation:shake .45s;}
  @keyframes shake{20%,80%{transform:translate(4px,-2px);}40%,60%{transform:translate(-7px,3px);}}
  #op .tap{margin-top:34px;font-family:inherit;font-size:24px;font-weight:900;color:#5a2800;letter-spacing:.2em;cursor:pointer;
    background:linear-gradient(135deg,#fff3a0,#ffc531);border:3px solid #fff;border-radius:999px;padding:14px 46px;
    box-shadow:0 6px 0 #c47a00,0 10px 24px rgba(120,30,0,.45);animation:joinIn .5s ease-out 1.1s both,joinPulse 1.6s ease-in-out 1.6s infinite;}
  #op .tap:active{transform:translateY(4px);box-shadow:0 2px 0 #c47a00;}
  #op .resume{margin-top:18px;font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:rgba(80,10,0,.35);
    border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 18px;cursor:pointer;animation:joinIn .5s ease-out 1.4s both;}
  @keyframes joinIn{0%{opacity:0;transform:translateY(20px);}100%{opacity:1;transform:none;}}
  @keyframes joinPulse{50%{transform:scale(1.06);}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ===== チーム選択 ===== */
  #pick h2{font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(120,20,0,.6);margin-bottom:4px;}
  #pick .sub{font-size:13px;font-weight:700;color:#fff8e0;margin-bottom:14px;text-shadow:0 1px 4px rgba(120,20,0,.6);}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,460px);}
  .card{position:relative;border:none;border-radius:22px;padding:8px 6px 10px;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 20px rgba(80,20,0,.3);
    animation:cardIn .45s cubic-bezier(.2,.8,.3,1.4) both;}
  .card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
  @keyframes cardIn{0%{transform:translateY(30px) scale(.8);opacity:0;}100%{transform:none;opacity:1;}}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .card img{width:86%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));animation:bob 2.4s ease-in-out infinite;}
  .card:nth-child(2) img{animation-delay:.3s}.card:nth-child(3) img{animation-delay:.6s}.card:nth-child(4) img{animation-delay:.9s}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .card .nm{font-size:16px;font-weight:900;line-height:1.2;}
  .card .tm{font-size:12px;font-weight:800;opacity:.9;margin-top:2px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.35);}
  .card.red{background:linear-gradient(160deg,#ffb3c1,#ff4d6d);color:#fff;}
  .card.green{background:linear-gradient(160deg,#b7f5d3,#1fc977);color:#fff;}
  .card.white{background:linear-gradient(160deg,#ffffff,#dfe5ee);color:#3d4452;}
  .card.blue{background:linear-gradient(160deg,#b9dbff,#2e8bff);color:#fff;}
  .card .nm,.card .tm{text-shadow:0 1px 3px rgba(0,0,0,.25);} .card.white .nm,.card.white .tm{text-shadow:none;}
  .card.cheer-card{grid-column:1/3;flex-direction:row;justify-content:center;gap:10px;padding:12px 10px;flex-wrap:wrap;
    background:linear-gradient(160deg,#fff6d6,#ffb84d);color:#5a2800;}
  .card.cheer-card .mega{font-size:30px;}
  .card.cheer-card .tm{flex-basis:100%;text-align:center;background:rgba(255,255,255,.55);}
  .card.cheer-card .nm,.card.cheer-card .tm{text-shadow:none;}
  /* ニックネーム・応援 */
  .panel{background:rgba(255,255,255,.94);border-radius:22px;padding:20px 18px;width:min(100%,420px);box-shadow:0 8px 24px rgba(80,20,0,.35);text-align:center;}
  .panel h3{font-size:20px;font-weight:900;margin-bottom:6px;}
  .panel p{font-size:13px;color:#7a6a95;font-weight:700;margin-bottom:12px;}
  #nickIn{width:100%;font-family:inherit;font-size:22px;font-weight:800;text-align:center;padding:12px;border-radius:14px;border:3px solid #ffc531;outline:none;}
  .bigbtn{margin-top:14px;width:100%;font-family:inherit;font-size:20px;font-weight:900;color:#5a2800;border:none;border-radius:999px;padding:14px;cursor:pointer;
    background:linear-gradient(135deg,#fff3a0,#ffc531);box-shadow:0 5px 0 #c47a00;}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c47a00;}
  #cheer .who{font-size:15px;font-weight:900;color:#fff;background:rgba(80,10,0,.35);border-radius:999px;padding:6px 14px;}
  #cheer .phase{margin:14px 0 10px;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(120,20,0,.6);}
  .cbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,440px);}
  .cbtn{font-family:inherit;font-size:22px;font-weight:900;border:none;border-radius:20px;padding:22px 6px;cursor:pointer;color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.25);box-shadow:0 6px 0 rgba(0,0,0,.25);}
  .cbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .cbtn:nth-child(1){background:linear-gradient(150deg,#ff7a93,#ff2d55);} .cbtn:nth-child(2){background:linear-gradient(150deg,#4fe0a0,#0fb566);}
  .cbtn:nth-child(3){background:linear-gradient(150deg,#5fa8ff,#1a6fff);} .cbtn:nth-child(4){background:linear-gradient(150deg,#ffd24d,#ff9f1c);}
  .cbtn.sent{animation:sent .5s ease-out;}
  @keyframes sent{0%{transform:scale(.9);filter:brightness(1.6);}100%{transform:none;}}
  .cbtns.wait .cbtn{filter:grayscale(.6) brightness(.85);}
  .free{display:flex;gap:8px;width:min(100%,440px);margin-top:14px;}
  #freeIn{flex:1;min-width:0;font-family:inherit;font-size:17px;font-weight:700;padding:12px 14px;border-radius:14px;border:3px solid #fff;outline:none;box-shadow:0 4px 0 rgba(0,0,0,.2);}
  #freeSend{font-family:inherit;font-size:17px;font-weight:900;color:#5a2800;border:none;border-radius:14px;padding:0 18px;cursor:pointer;
    background:linear-gradient(135deg,#fff3a0,#ffc531);box-shadow:0 4px 0 #c47a00;}
  #freeSend:active{transform:translateY(3px);box-shadow:0 1px 0 #c47a00;}
  #cheerMsg{margin-top:12px;min-height:1.4em;font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(120,20,0,.6);}
  .card.chosen{animation:chosen .6s ease-out forwards;z-index:2;}
  @keyframes chosen{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1.06);}}

  /* ===== 早押し ===== */
  #play{justify-content:space-between;}
  .top{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .badge{font-weight:900;font-size:16px;padding:6px 14px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.2);}
  .conn{font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;background:rgba(80,10,0,.35);padding:5px 10px;border-radius:999px;}
  .conn i{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block;}
  .conn.ok i{background:#3dff9a;box-shadow:0 0 8px #3dff9a;} .conn.ng i{background:#ff6a6a;}
  .stage{display:flex;flex-direction:column;align-items:center;width:100%;}
  #mychar{width:min(58vw,250px);height:min(58vw,250px);object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 6px 10px rgba(80,20,0,.35));}
  #mychar.pop{animation:pop .45s cubic-bezier(.2,.8,.3,1.5);}
  @keyframes pop{0%{transform:translateY(14%) scale(.85);}100%{transform:none;}}
  #mychar.droop{animation:droop .5s ease-out;}
  @keyframes droop{0%{transform:translateY(-6%);}50%{transform:translateY(6%);}100%{transform:none;}}
  #status{margin-top:6px;background:rgba(255,255,255,.92);border-radius:18px;padding:10px 18px;min-height:3.6em;width:min(100%,420px);
    font-size:20px;font-weight:900;text-align:center;line-height:1.35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.15);}
  #status small{font-size:13px;font-weight:700;color:#7a6a95;}
  #buzz{width:min(62vw,250px);aspect-ratio:1;border-radius:50%;border:6px solid rgba(255,255,255,.85);cursor:pointer;font-family:inherit;
    font-size:40px;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 2px 4px rgba(0,0,0,.3);
    background:radial-gradient(circle at 35% 30%,var(--hi),var(--c) 60%,var(--lo));
    box-shadow:0 12px 0 var(--lo),0 18px 34px rgba(0,0,0,.45);transition:transform .06s,box-shadow .06s,filter .2s;}
  #buzz.down{transform:translateY(9px);box-shadow:0 3px 0 var(--lo),0 8px 18px rgba(0,0,0,.45);}
  #buzz.dis{filter:grayscale(.85) brightness(.75);}
  #buzz.first{animation:glow .6s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 12px 0 var(--lo),0 0 0 0 rgba(255,255,255,0);}50%{box-shadow:0 12px 0 var(--lo),0 0 0 18px rgba(255,255,255,.7);}}
  .team-red{--c:#ff2d55;--hi:#ff9fb2;--lo:#a3102f;} .team-green{--c:#0fb566;--hi:#7bf0b5;--lo:#06683a;}
  .team-white{--c:#e9edf3;--hi:#fff;--lo:#8d97a8;} .team-blue{--c:#1a6fff;--hi:#8cc2ff;--lo:#0a3e9e;}
  .team-white #buzz{color:#3d4452;text-shadow:none;}
  .foot{display:flex;gap:10px;align-items:center;}
  .link{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;font-family:inherit;}
  .room{font-size:11px;color:#fff;opacity:.85;}
</style>
</head>

document.querySelectorAll('[data-char]').forEach(im=>im.src=CHARA[im.dataset.char].normal);

setTimeout(()=>{ $('op').classList.add('shake'); if(navigator.vibrate) navigator.vibrate(30); },720);
$('btnJoin').addEventListener('click',()=>show('pick'));

/* ---- チーム選択 ---- */
document.querySelectorAll('.card[data-team]').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.team; const im=b.querySelector('img'); im.src=CHARA[t].happy; b.classList.add('chosen');
  if(navigator.vibrate) navigator.vibrate(40);
  setTimeout(()=>{ b.classList.remove('chosen'); im.src=CHARA[t].normal; chooseTeam(t); },650);
}));
function chooseTeam(t){
  role='team'; store('a25_role','team');
  team=t; store('a25_team_'+ROOM,t);
  document.body.className='team-'+t;
  $('teamBadge').textContent=CHAR_NAME[t]+'（'+TEAM_NAME[t]+'）';
  $('teamBadge').style.background=TEAM_BG[t]; $('teamBadge').style.color=(t==='white')?'#3d4452':'#fff';
  pose='';
  show('play'); connect();
  if(conn&&conn.open) conn.send(hello());
  render();
}
$('change').addEventListener('click',()=>{ store('a25_team_'+ROOM); show('pick'); });

/* ---- 接続（切れたら自動で再接続） ---- */
function setConn(ok,text){ for(const [c,t] of [[$('conn'),$('connText')],[$('conn2'),$('connText2')]]){ c.classList.toggle('ok',ok===true); c.classList.toggle('ng',ok===false); t.textContent=text; } }
function hello(){ return role==='cheer' ? {type:'hello',role:'cheer',name:nick} : {type:'hello',team}; }
function connect(){
  if(typeof Peer==='undefined'){ setConn(false,'通信部品を読み込めません'); $('status').innerHTML='インターネットに<br>つながっていますか？'; return; }
  if(peer && !peer.destroyed && conn && conn.open) return;
  clearTimeout(retryTimer);
  if(!peer || peer.destroyed || peer.disconnected){
    try{ if(peer) peer.destroy(); }catch(e){}
    peer=new Peer(undefined,peerOpts());
    peer.on('open',()=>openConn());
    peer.on('error',e=>{ if(e && e.type==='peer-unavailable'){ hostMissing=true; showMissing(); } else setConn(false,'再接続中…'); scheduleRetry(); });
    peer.on('disconnected',()=>{ setConn(false,'再接続中…'); scheduleRetry(); });
  }else openConn();
}
function showMissing(){ setConn(false,'会場の画面が見つかりません');
  $('status').innerHTML='会場のゲーム画面が<br>受付中になっていません<small>受付中になると自動でつながります</small>'; }
function openConn(){
  try{ if(conn) conn.close(); }catch(e){}
  hostMissing=false; setConn(null,'会場の画面を探しています…');
  conn=peer.connect(HOST_ID,{reliable:true}); const c=conn;
  const to=setTimeout(()=>{ if(c.open) return;
    if(hostMissing) showMissing();
    else { setConn(false,'通信がつながりません'); $('status').innerHTML='通信がつながりません<small>Wi-Fiを切って携帯回線で試してください</small>'; }
    scheduleRetry(); },8000);
  c.on('open',()=>{ clearTimeout(to); setConn(true,'接続OK'); c.send(hello()); });
  c.on('data',d=>{ if(d&&d.type==='state'){ state=d; render(); renderCheer(); } if(d&&d.type==='ack'){ flash(); } });
  c.on('close',()=>{ setConn(false,'再接続中…'); scheduleRetry(); });
  c.on('error',()=>{ setConn(false,'再接続中…'); scheduleRetry(); });
}
function scheduleRetry(){ clearTimeout(retryTimer); retryTimer=setTimeout(()=>{ if(!(conn&&conn.open)) connect(); },2500); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && (team||role==='cheer')) connect(); });

/* ---- 早押し ---- */
const btn=$('buzz');
function press(e){
  if(e) e.preventDefault();
  if(!team) return;
  btn.classList.add('down'); setTimeout(()=>btn.classList.remove('down'),120);
  if(navigator.vibrate) navigator.vibrate(40);
  if(!(conn&&conn.open)){ connect(); return; }
  if(!state||!state.open) return;
  if(state.order.includes(team)||state.out.includes(team)) return;
  conn.send({type:'buzz',team});
}
btn.addEventListener('touchstart',press,{passive:false});
btn.addEventListener('mousedown',e=>{ if(e.button===0) press(e); });
function flash(){ btn.animate([{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:300}); }

/* ---- 表示 ---- */
let pose='';
function setPose(p){ if(!team||pose===p) return; pose=p; const im=$('mychar'); im.src=CHARA[team][p];
  im.classList.remove('pop','droop'); void im.offsetWidth; if(p==='happy') im.classList.add('pop'); if(p==='sad') im.classList.add('droop'); }
function render(){
  const st=$('status');
  btn.classList.remove('first','dis');
  if(!state){ setPose('normal'); st.innerHTML='会場の画面を待っています…'; btn.classList.add('dis'); return; }
  const idx=state.order.indexOf(team), curTeam=state.order[state.cur];
  if(state.out.includes(team)){ setPose('sad'); st.innerHTML='お手つき…<small>この問題はお休みです</small>'; btn.classList.add('dis'); return; }
  if(state.done){
    if(state.winner===team){ setPose('happy'); st.innerHTML='⭕ 正解！<small>パネルをゲット！ 次の問題を待っています</small>'; }
    else { setPose('normal'); st.innerHTML='締め切りました<small>次の問題を待っています</small>'; }
    btn.classList.add('dis'); return;
  }
  if(curTeam===team){ setPose('happy'); st.innerHTML='🎤 あなたの回答！<small>A〜D で答えてください</small>'; btn.classList.add('first'); return; }
  if(idx>=0){ setPose('happy'); st.innerHTML=`${idx+1}番目に押しました<small>前のチームが外れたら回答できます</small>`; btn.classList.add('dis'); return; }
  setPose('normal');
  if(state.wait){ st.innerHTML=`第${state.q}問<small>選択肢が出たら押せます</small>`; btn.classList.add('dis'); return; }
  if(!state.open){ st.innerHTML=state.q>0?'締め切りました<small>次の問題を待っています</small>':'まもなく始まります<small>問題が出たら押してください</small>'; btn.classList.add('dis'); return; }
  st.innerHTML=`第${state.q}問！<small>分かったら押す！</small>`;
}

/* ---- 応援 ---- */
const CH_QUIZ=['分かった！','うーむ..','これはいける！','がんばれ！'], CH_ANS=['余裕！','これは無理！','容赦ないね！','強い！'];
$('btnCheerRole').addEventListener('click',()=>{ $('nickIn').value=load('a25_nick')||''; show('nick'); setTimeout(()=>$('nickIn').focus(),100); });
$('btnNickBack').addEventListener('click',()=>show('pick'));
$('btnNickOk').addEventListener('click',()=>{ const v=$('nickIn').value.trim().slice(0,10); if(!v){ $('nickIn').focus(); return; } startCheer(v); });
$('nickIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnNickOk').click(); });
$('btnCheerQuit').addEventListener('click',()=>{ store('a25_role'); role='team'; try{ if(conn) conn.close(); }catch(e){} show('pick'); });
function startCheer(name){
  role='cheer'; nick=name; team=null; store('a25_role','cheer'); store('a25_nick',name); store('a25_team_'+ROOM);
  document.body.className=''; $('cheerWho').textContent='📣 '+name+' さん';
  show('cheer'); renderCheer(true); connect(); if(conn&&conn.open) conn.send(hello());
}
let lastSent=0, curSet='';
function renderCheer(force){
  if(role!=='cheer') return;
  const ans = state && state.phase==='answer';
  const set = ans ? 'ans' : 'quiz';
  $('cheerPhase').textContent = ans ? '回答発表！ ひとこと言おう' : 'クイズ中！ 応援しよう';
  if(set===curSet && !force) return; curSet=set;
  const box=$('cbtns'); box.innerHTML='';
  (ans?CH_ANS:CH_QUIZ).forEach(t=>{ const b=document.createElement('button'); b.className='cbtn'; b.textContent=t; b.onclick=()=>sendCheer(t,b); box.appendChild(b); });
}
$('freeSend').addEventListener('click',()=>{ const v=$('freeIn').value.replace(/\s+/g,' ').trim().slice(0,20); if(!v){ $('freeIn').focus(); return; }
  if(sendCheer(v,$('freeSend'),true)) $('freeIn').value=''; });
$('freeIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('freeSend').click(); } });
function sendCheer(t,b,free){
  const now=Date.now(); if(now-lastSent<1300){ $('cheerMsg').textContent='ちょっと待ってね…'; return false; }
  if(!(conn&&conn.open)){ connect(); $('cheerMsg').textContent='接続中です…'; return false; }
  lastSent=now; conn.send({type:'cheer',name:nick,text:t,free:!!free});
  b.classList.remove('sent'); void b.offsetWidth; b.classList.add('sent'); if(navigator.vibrate) navigator.vibrate(25);
  $('cheerMsg').textContent='「'+t+'」を送りました！';
  $('cbtns').classList.add('wait'); setTimeout(()=>$('cbtns').classList.remove('wait'),1300);
  return true;
}

/* 前回選んだチームを覚えておく（開き直したときはOPを飛ばす） */
// 毎回タイトル画面から始め、前回の参加内容はリセットする
try{ ['a25_role','a25_nick','a25_team_'+ROOM].forEach(k=>localStorage.removeItem(k)); }catch(e){}
</script>
